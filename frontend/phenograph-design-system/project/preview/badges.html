<!doctype html><html><head><meta charset="utf-8"><title>Badges & tags</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-surface">
  <div class="label" style="margin-bottom:12px;">Status · confidence · HPO tag</div>
  <div style="display:flex; flex-wrap:wrap; gap:8px;">
    <span style="font-size:12px; font-weight:500; padding:3px 9px; background:#e8efdd; color:#3f7a3a; border-radius:9999px;">Analysis complete</span>
    <span style="font-size:12px; font-weight:500; padding:3px 9px; background:#dde8e7; color:#3a4a50; border-radius:9999px;">In review</span>
    <span style="font-size:12px; font-weight:500; padding:3px 9px; background:#f5ecd0; color:#8a6a1f; border-radius:9999px;">Low resolution</span>
    <span style="font-size:12px; font-weight:500; padding:3px 9px; background:#f4dad3; color:#8a3a2e; border-radius:9999px;">Failed</span>
  </div>
  <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;">
    <span style="font-family:var(--font-mono); font-size:12px; padding:3px 8px; background:#f1ede3; color:#15282f; border-radius:4px; border:1px solid #e6e1d4;">HP:0000316</span>
    <span style="font-family:var(--font-mono); font-size:12px; padding:3px 8px; background:#f1ede3; color:#15282f; border-radius:4px; border:1px solid #e6e1d4;">HP:0000463</span>
    <span style="font-family:var(--font-mono); font-size:12px; padding:3px 8px; background:#f1ede3; color:#15282f; border-radius:4px; border:1px solid #e6e1d4;">HP:0000601</span>
    <span style="font-family:var(--font-mono); font-size:12px; padding:3px 8px; background:rgba(6,129,118,0.10); color:#068176; border-radius:4px; border:1px solid rgba(6,129,118,0.3);">+ Add feature</span>
  </div>
  <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center;">
    <span class="mono" style="color:var(--fg-3);">Confidence:</span>
    <span style="font-size:12px; font-weight:500; padding:3px 9px; background:#068176; color:#fff; border-radius:4px;">High · 0.94</span>
    <span style="font-size:12px; font-weight:500; padding:3px 9px; background:#a2b568; color:#15282f; border-radius:4px;">Med · 0.62</span>
    <span style="font-size:12px; font-weight:500; padding:3px 9px; background:#e6e1d4; color:#3a4a50; border-radius:4px;">Low · 0.18</span>
  </div>
</div>
</body></html>
