<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-surface">
  <div class="label" style="margin-bottom:12px;">Primary · secondary · ghost · danger</div>
  <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
    <button style="font-family:var(--font-body); font-size:14px; font-weight:500; padding:10px 16px; background:#068176; color:#fff; border:none; border-radius:8px; cursor:pointer;">Analyze image</button>
    <button style="font-family:var(--font-body); font-size:14px; font-weight:500; padding:10px 16px; background:transparent; color:#15282f; border:1px solid #15282f; border-radius:8px; cursor:pointer;">Cancel</button>
    <button style="font-family:var(--font-body); font-size:14px; font-weight:500; padding:10px 16px; background:transparent; color:#068176; border:none; border-radius:8px; cursor:pointer;">View details</button>
    <button style="font-family:var(--font-body); font-size:14px; font-weight:500; padding:10px 16px; background:#8a3a2e; color:#fff; border:none; border-radius:8px; cursor:pointer;">Delete case</button>
    <button style="font-family:var(--font-body); font-size:14px; font-weight:500; padding:10px 16px; background:#068176; color:#fff; border:none; border-radius:8px; opacity:0.4;">Disabled</button>
  </div>
  <div style="display:flex; gap:10px; margin-top:12px;">
    <button style="font-family:var(--font-body); font-size:12px; font-weight:500; padding:6px 10px; background:#068176; color:#fff; border:none; border-radius:6px;">Small</button>
    <button style="font-family:var(--font-body); font-size:14px; font-weight:500; padding:10px 16px; background:#068176; color:#fff; border:none; border-radius:8px;">Default</button>
    <button style="font-family:var(--font-body); font-size:15px; font-weight:500; padding:14px 22px; background:#068176; color:#fff; border:none; border-radius:8px;">Large</button>
  </div>
</div>
</body></html>
