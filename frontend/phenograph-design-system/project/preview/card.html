<!doctype html><html><head><meta charset="utf-8"><title>Card</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-surface">
  <div class="label" style="margin-bottom:12px;">Card · hairline border, no shadow</div>
  <div style="background:#fff; border:1px solid #e6e1d4; border-radius:8px; padding:18px; max-width:520px;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
      <div>
        <div style="font-family:var(--font-mono); font-size:12px; color:#6a757a;">Case · 2025-0481</div>
        <div style="font-family:var(--font-display); font-size:22px; font-weight:500; line-height:1.2; margin-top:2px;">Noonan syndrome</div>
      </div>
      <span style="font-size:12px; font-weight:500; padding:3px 9px; background:#e8efdd; color:#3f7a3a; border-radius:9999px;">Complete</span>
    </div>
    <div style="font-size:13px; color:#3a4a50;">27 features matched · posterior probability <span style="font-family:var(--font-mono); color:#068176;">0.41</span></div>
    <div style="margin-top:12px; height:4px; background:#e6e1d4; border-radius:2px;">
      <div style="width:41%; height:100%; background:#068176; border-radius:2px;"></div>
    </div>
  </div>
</div>
</body></html>
