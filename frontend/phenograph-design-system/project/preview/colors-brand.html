<!doctype html><html><head><meta charset="utf-8"><title>Brand palette</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-surface">
  <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap: 10px;">
    <div>
      <div style="background:#a2b568; height:70px; border-radius:8px;"></div>
      <div style="margin-top:8px; font-size:13px; font-weight:500;">Moss</div>
      <div class="mono">#a2b568</div>
    </div>
    <div>
      <div style="background:#697431; height:70px; border-radius:8px;"></div>
      <div style="margin-top:8px; font-size:13px; font-weight:500;">Olive</div>
      <div class="mono">#697431</div>
    </div>
    <div>
      <div style="background:#475d2e; height:70px; border-radius:8px;"></div>
      <div style="margin-top:8px; font-size:13px; font-weight:500;">Forest</div>
      <div class="mono">#475d2e</div>
    </div>
    <div>
      <div style="background:#15282f; height:70px; border-radius:8px;"></div>
      <div style="margin-top:8px; font-size:13px; font-weight:500;">Midnight</div>
      <div class="mono">#15282f</div>
    </div>
    <div>
      <div style="background:#114643; height:70px; border-radius:8px;"></div>
      <div style="margin-top:8px; font-size:13px; font-weight:500;">Deep&nbsp;teal</div>
      <div class="mono">#114643</div>
    </div>
    <div>
      <div style="background:#068176; height:70px; border-radius:8px;"></div>
      <div style="margin-top:8px; font-size:13px; font-weight:500;">Bright&nbsp;teal</div>
      <div class="mono">#068176</div>
    </div>
  </div>
</div>
</body></html>
