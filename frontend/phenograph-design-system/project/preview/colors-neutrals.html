<!doctype html><html><head><meta charset="utf-8"><title>Neutrals</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-surface">
  <div class="label" style="margin-bottom:10px;">Warm paper neutrals · cool ink neutrals</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom:12px;">
    <div><div style="background:#faf8f2; height:54px; border-radius:6px; border:1px solid #e6e1d4;"></div><div style="margin-top:6px; font-size:12px;">Paper</div><div class="mono">#faf8f2</div></div>
    <div><div style="background:#f1ede3; height:54px; border-radius:6px;"></div><div style="margin-top:6px; font-size:12px;">Paper 2</div><div class="mono">#f1ede3</div></div>
    <div><div style="background:#e6e1d4; height:54px; border-radius:6px;"></div><div style="margin-top:6px; font-size:12px;">Line</div><div class="mono">#e6e1d4</div></div>
    <div><div style="background:#fff; height:54px; border-radius:6px; border:1px solid #e6e1d4;"></div><div style="margin-top:6px; font-size:12px;">Inset</div><div class="mono">#ffffff</div></div>
  </div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
    <div><div style="background:#15282f; height:54px; border-radius:6px;"></div><div style="margin-top:6px; font-size:12px;">Ink</div><div class="mono">#15282f</div></div>
    <div><div style="background:#3a4a50; height:54px; border-radius:6px;"></div><div style="margin-top:6px; font-size:12px;">Ink 2</div><div class="mono">#3a4a50</div></div>
    <div><div style="background:#6a757a; height:54px; border-radius:6px;"></div><div style="margin-top:6px; font-size:12px;">Ink 3</div><div class="mono">#6a757a</div></div>
    <div><div style="background:#9aa2a6; height:54px; border-radius:6px;"></div><div style="margin-top:6px; font-size:12px;">Ink 4</div><div class="mono">#9aa2a6</div></div>
  </div>
</div>
</body></html>
