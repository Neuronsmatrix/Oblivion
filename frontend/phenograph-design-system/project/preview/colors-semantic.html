<!doctype html><html><head><meta charset="utf-8"><title>Semantic colors</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-surface">
  <div class="label" style="margin-bottom:10px;">Status · paired fg/bg</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
    <div style="display:flex; align-items:center; gap:10px; padding:10px 12px; background:#e8efdd; border-radius:8px;">
      <div style="width:10px; height:10px; border-radius:50%; background:#3f7a3a;"></div>
      <div>
        <div style="font-size:13px; font-weight:500; color:#3f7a3a;">Success</div>
        <div class="mono">#3f7a3a on #e8efdd</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px; padding:10px 12px; background:#f5ecd0; border-radius:8px;">
      <div style="width:10px; height:10px; border-radius:50%; background:#8a6a1f;"></div>
      <div>
        <div style="font-size:13px; font-weight:500; color:#8a6a1f;">Warning</div>
        <div class="mono">#8a6a1f on #f5ecd0</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px; padding:10px 12px; background:#f4dad3; border-radius:8px;">
      <div style="width:10px; height:10px; border-radius:50%; background:#8a3a2e;"></div>
      <div>
        <div style="font-size:13px; font-weight:500; color:#8a3a2e;">Danger</div>
        <div class="mono">#8a3a2e on #f4dad3</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px; padding:10px 12px; background:#dde8e7; border-radius:8px;">
      <div style="width:10px; height:10px; border-radius:50%; background:#3a4a50;"></div>
      <div>
        <div style="font-size:13px; font-weight:500; color:#3a4a50;">Info</div>
        <div class="mono">#3a4a50 on #dde8e7</div>
      </div>
    </div>
  </div>
</div>
</body></html>
