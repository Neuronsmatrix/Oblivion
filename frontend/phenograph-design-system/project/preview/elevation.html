<!doctype html><html><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-surface">
  <div class="label" style="margin-bottom:14px;">Two elevations · cool-toned · no glows</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:14px;">
    <div style="background:#fff; border:1px solid #e6e1d4; border-radius:8px; padding:16px; height:96px;">
      <div style="font-size:13px; font-weight:500;">Flat</div>
      <div class="mono">border · no shadow</div>
    </div>
    <div style="background:#fff; border-radius:8px; padding:16px; height:96px; box-shadow:0 1px 2px rgba(21,40,47,0.04), 0 1px 1px rgba(21,40,47,0.03);">
      <div style="font-size:13px; font-weight:500;">Shadow 1</div>
      <div class="mono">resting · rare</div>
    </div>
    <div style="background:#fff; border-radius:8px; padding:16px; height:96px; box-shadow:0 8px 24px rgba(21,40,47,0.08), 0 2px 6px rgba(21,40,47,0.06);">
      <div style="font-size:13px; font-weight:500;">Shadow 2</div>
      <div class="mono">popover · modal</div>
    </div>
  </div>
</div>
</body></html>
