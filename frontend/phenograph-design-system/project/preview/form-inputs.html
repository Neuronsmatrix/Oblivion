<!doctype html><html><head><meta charset="utf-8"><title>Form inputs</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-surface">
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
    <div>
      <div class="label" style="margin-bottom:6px;">Text · default</div>
      <input value="MRN-20481" style="width:100%; padding:9px 12px; font-family:var(--font-body); font-size:14px; border:1px solid #e6e1d4; border-radius:6px; background:#fff; color:#15282f;">
    </div>
    <div>
      <div class="label" style="margin-bottom:6px;">Text · focused</div>
      <input value="MRN-20481" style="width:100%; padding:9px 12px; font-family:var(--font-body); font-size:14px; border:1px solid #068176; border-radius:6px; background:#fff; color:#15282f; outline:2px solid rgba(6,129,118,0.25); outline-offset:0;">
    </div>
    <div>
      <div class="label" style="margin-bottom:6px;">Select</div>
      <div style="padding:9px 12px; font-family:var(--font-body); font-size:14px; border:1px solid #e6e1d4; border-radius:6px; background:#fff; display:flex; justify-content:space-between; color:#15282f;">Pediatric · under 18<span style="color:#9aa2a6;">▾</span></div>
    </div>
    <div>
      <div class="label" style="margin-bottom:6px;">Error</div>
      <input value="mrn-20" style="width:100%; padding:9px 12px; font-family:var(--font-body); font-size:14px; border:1px solid #8a3a2e; border-radius:6px; background:#fff; color:#15282f;">
      <div style="margin-top:4px; font-size:12px; color:#8a3a2e;">MRN must be 8 digits.</div>
    </div>
  </div>
</div>
</body></html>
