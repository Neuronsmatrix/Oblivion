<!doctype html><html><head><meta charset="utf-8"><title>Iconography</title><link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="card-surface">
  <div class="label" style="margin-bottom:12px;">Lucide · 1.5px stroke · 20px default</div>
  <div style="display:flex; flex-wrap:wrap; gap:18px; color:#15282f;">
    <i data-lucide="scan-face" style="width:24px; height:24px;"></i>
    <i data-lucide="dna" style="width:24px; height:24px;"></i>
    <i data-lucide="microscope" style="width:24px; height:24px;"></i>
    <i data-lucide="file-search" style="width:24px; height:24px;"></i>
    <i data-lucide="stethoscope" style="width:24px; height:24px;"></i>
    <i data-lucide="upload" style="width:24px; height:24px;"></i>
    <i data-lucide="check" style="width:24px; height:24px;"></i>
    <i data-lucide="alert-triangle" style="width:24px; height:24px;"></i>
    <i data-lucide="info" style="width:24px; height:24px;"></i>
    <i data-lucide="chevron-right" style="width:24px; height:24px;"></i>
    <i data-lucide="filter" style="width:24px; height:24px;"></i>
    <i data-lucide="download" style="width:24px; height:24px;"></i>
    <i data-lucide="users" style="width:24px; height:24px;"></i>
    <i data-lucide="lock" style="width:24px; height:24px;"></i>
    <i data-lucide="search" style="width:24px; height:24px;"></i>
  </div>
  <div class="mono" style="margin-top:10px; color:var(--fg-3);">No emoji. No unicode arrows. currentColor inheritance.</div>
</div>
<script>lucide.createIcons()</script>
</body></html>
