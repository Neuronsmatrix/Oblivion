<!doctype html><html><head><meta charset="utf-8"><title>Landmark illustration</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-surface">
  <div style="display:grid; grid-template-columns: 1fr 1.3fr; gap:16px; align-items:center;">
    <div style="background:#faf8f2; border:1px solid #e6e1d4; border-radius:8px; padding:10px;">
      <img src="../assets/landmarks.svg" style="width:100%; display:block;">
    </div>
    <div>
      <div class="label" style="margin-bottom:6px;">Brand illustration</div>
      <div style="font-family:var(--font-display); font-size:20px; line-height:1.25; color:var(--ink);">Abstract landmark graphs — never an identifiable face.</div>
      <div style="margin-top:8px; font-size:13px; color:var(--ink-2);">Dot-network profile geometry conveys the phenotyping idea without using patient imagery.</div>
    </div>
  </div>
</div>
</body></html>
