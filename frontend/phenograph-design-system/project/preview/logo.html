<!doctype html><html><head><meta charset="utf-8"><title>Logo</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-surface">
  <div style="display:grid; grid-template-columns: 1.3fr 1fr 0.6fr; gap:16px; align-items:center;">
    <div style="background:#faf8f2; border:1px solid #e6e1d4; border-radius:8px; padding:18px; display:flex; align-items:center; justify-content:center; height:120px;">
      <img src="../assets/logo.svg" style="height:48px;">
    </div>
    <div style="background:#15282f; border-radius:8px; padding:18px; display:flex; align-items:center; justify-content:center; height:120px;">
      <img src="../assets/logo.svg" style="height:48px; filter: invert(1) brightness(1.2);">
    </div>
    <div style="background:#faf8f2; border:1px solid #e6e1d4; border-radius:8px; padding:18px; display:flex; align-items:center; justify-content:center; height:120px;">
      <img src="../assets/logo-mark.svg" style="height:56px;">
    </div>
  </div>
  <div class="mono" style="margin-top:10px;">logo.svg · logo.svg on dark · logo-mark.svg</div>
</div>
</body></html>
