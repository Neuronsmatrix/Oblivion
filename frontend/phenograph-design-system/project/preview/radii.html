<!doctype html><html><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-surface">
  <div class="label" style="margin-bottom:12px;">Restrained · no big pills</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:12px;">
    <div>
      <div style="height:70px; background:#f1ede3; border:1px solid #e6e1d4; border-radius:4px;"></div>
      <div style="margin-top:6px; font-size:12px; font-weight:500;">sm · 4</div>
      <div class="mono">inputs · chips</div>
    </div>
    <div>
      <div style="height:70px; background:#f1ede3; border:1px solid #e6e1d4; border-radius:8px;"></div>
      <div style="margin-top:6px; font-size:12px; font-weight:500;">md · 8</div>
      <div class="mono">cards · buttons</div>
    </div>
    <div>
      <div style="height:70px; background:#f1ede3; border:1px solid #e6e1d4; border-radius:16px;"></div>
      <div style="margin-top:6px; font-size:12px; font-weight:500;">lg · 16</div>
      <div class="mono">modals</div>
    </div>
    <div>
      <div style="height:70px; background:#f1ede3; border:1px solid #e6e1d4; border-radius:9999px;"></div>
      <div style="margin-top:6px; font-size:12px; font-weight:500;">full</div>
      <div class="mono">tags only</div>
    </div>
  </div>
</div>
</body></html>
