## Oblivion API gateway.
## Single entry point on :8080 that routes by path prefix to the 7 services.
## The services run on the host (not in compose), so we proxy to
## host.docker.internal — docker-compose maps that to the host gateway IP via
## `extra_hosts: host.docker.internal:host-gateway`.

worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream auth        { server host.docker.internal:3001; }
    upstream cases       { server host.docker.internal:3002; }
    upstream labs        { server host.docker.internal:3003; }
    upstream recognition { server host.docker.internal:3004; }
    upstream notifier    { server host.docker.internal:3005; }
    upstream reference   { server host.docker.internal:3006; }
    upstream billing     { server host.docker.internal:3007; }

    server {
        listen 8080;

        # Forwarded headers applied to every proxied request.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Gateway liveness (each service's own /health is on its direct port).
        location = /healthz { default_type text/plain; return 200 "ok\n"; }

        # proxy_pass without a URI path preserves the full original request URI,
        # so /auth/login -> auth:3001/auth/login, etc.
        location /auth/         { proxy_pass http://auth; }
        location /cases         { proxy_pass http://cases; }        # /cases and /cases/...
        location /labs/         { proxy_pass http://labs; }
        location = /recognize   { proxy_pass http://recognition; }
        location /notifications { proxy_pass http://notifier; }     # incl. /{id}/read
        location /reference/    { proxy_pass http://reference; }
        location /billing/      { proxy_pass http://billing; }
    }
}
